<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body bgcolor="#FFFFFF">

    <table width="90%" align="center"
           border="1" cellpadding="12">
        <tr bgcolor="#D6EAF8">
            <td align="center">
                <font size="5">
                    <b>📝 STUDENT REGISTRATION</b>
                </font>
                <br>
                <font size="3">
                    Question Bank Student Details
                </font>
            </td>
        </tr>
    </table>
    <br>
    <form action="courses.html">
        <table width="80%" align="center"
               border="1" cellpadding="9"
               cellspacing="0">
            <tr bgcolor="#EAF2F8">
                <th colspan="2">
                    Personal Details
                </th>
            </tr>
            <tr>
                <td width="35%">
                    <b>Name</b>
                </td>
                <td>
                    <input type="text" name="name" size="35" required>
                </td>
            </tr>
            <tr>
                <td>
                    <b>Date of Birth</b>
                </td>
                <td>
                    <input type="date" name="dob">
                </td>
            </tr>
            <tr>
                <td>
                    <b>Photograph</b>
                </td>
                <td>
                    <input type="file"
                        name="photo">
                </td>
            </tr>
            <tr bgcolor="#EAF2F8">
                <th colspan="2">
                    Academic Details
                </th>
            </tr>
            <tr>
                <td>
                    <b>Roll Number</b>
                </td>
                <td>
                    <input type="text" name="roll" size="35" required>
                </td>
            </tr>
            <tr>
                <td>
                    <b>Department</b>
                </td>
                <td>
                    <select name="department">
                        <option>
                            Select Department
                        </option>
                        <option>
                            Computer Science and Engineering
                        </option>
                        <option>
                            Information Technology
                        </option>
                        <option>
                            Electronics and Communication Engineering
                        </option>
                        <option>
                            Electrical Engineering
                        </option>
                        <option>
                            Mechanical Engineering
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <b>Semester</b>
                </td>
                <td>
                    <select name="semester">
                        <option>
                            Select Semester
                        </option>

                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                    </select>
                </td>
            </tr>
            <tr bgcolor="#EAF2F8">
                <th colspan="2">
                    Contact Details
                </th>
            </tr>
            <tr>
                <td>
                    <b>Email</b>
                </td>
                <td>
                    <input type="email" name="email" size="35" required>
                </td>
            </tr>
            <tr>
                <td>
                    <b>Contact Number</b>
                </td>
                <td>
                    <input type="tel" name="contact" size="35">
                </td>
            </tr>
            <tr>
                <td>
                    <b>Address</b>
                </td>
                <td>
                    <textarea name="address" rows="4" cols="35"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2"
                    align="center">
                    <input type="submit" value="Submit">
                    &nbsp;&nbsp;
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
    <br>
</body>
</html>
