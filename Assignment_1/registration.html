<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>QUESTION BANK</h1>

    <hr>

    <h2>Student Registration Form</h2>

    <form action="courses.html">

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Roll Number:</label><br>
        <input type="text" name="roll" required><br><br>

        <label>Department:</label><br>
        <input type="text" name="department"><br><br>

        <label>Semester:</label><br>
        <select name="semester">
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
        </select><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Contact Number:</label><br>
        <input type="tel" name="contact"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <label>Photograph:</label><br>
        <input type="file" name="photo"><br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Enter Question Bank">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
