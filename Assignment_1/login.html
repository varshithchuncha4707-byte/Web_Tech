<!DOCTYPE html>
<html>

<head>
    <title>Student Login</title>
</head>

<body bgcolor="#FFFFFF">
    <br><br>
    <table width="55%"
           align="center"
           border="1"
           cellpadding="15"
           cellspacing="0">

        <tr bgcolor="#D6EAF8">
            <td align="center">
                <font size="5">
                    <b>🔑 STUDENT LOGIN</b>
                </font>
                <br>
                <font size="3">
                    Question Bank
                </font>
            </td>
        </tr>
        <tr>
            <td>
                <form action="courses.html">
                    <table width="100%" cellpadding="8">
                        <tr>
                            <td align="right">
                                <b>Email:</b>
                            </td>

                            <td>
                                <input type="email" name="email" size="30" required>
                            </td>
                        </tr>
                        <tr>
                            <td align="right">
                                <b>Password:</b>
                            </td>
                            <td>
                                <input type="password" name="password" size="30" required>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Login">
                                &nbsp;&nbsp;
                                <input type="reset" value="Reset">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
        <tr bgcolor="#F8F9F9">
            <td align="center">
                <b>New Student?</b>
                &nbsp;
                <a href="registration.html">
                    Register here
                </a>
            </td>
        </tr>
    </table>
</body>
</html>
